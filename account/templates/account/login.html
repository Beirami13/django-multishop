{% extends 'base.html' %}
{% load static %}

{% block main %}

<!-- Login Start -->
<div class="container-fluid pt-5 pb-5">

    <h2 class="section-title position-relative text-uppercase text-center mx-xl-5 mb-4">
        <span class="bg-secondary pr-3">Login</span>
    </h2>

    <div class="row px-xl-5 justify-content-center">

        <div class="col-lg-6">

            <div class="bg-light p-30">

                <form method="POST">

                    {% csrf_token %}

                    <div class="form-group">
                        <label for="phone_number">Phone Number</label>
                        {% for error in form.phone_number.errors %}
                            <p class="alert alert-danger">{{ form.phone_number.errors }}</p>
                        {% endfor %}
                        {{ form.phone_number }}
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        {{ form.password }}
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>

                    <button type="submit"
                            class="btn btn-primary btn-block py-2">
                        Login
                    </button>

                    <div class="text-center mt-4">
                        <p class="mb-0">
                            Don't have an account?
                            <a href="#">Create Account</a>
                        </p>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>
<!-- Login End -->

{% endblock %}
