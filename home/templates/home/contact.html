{% extends 'base.html' %}
{% load static %}

{% block main %}

<!-- Breadcrumb Start -->

<div class="container-fluid">
    <div class="row px-xl-5">
        <div class="col-12">
            <nav class="breadcrumb bg-light mb-30">
                <a class="breadcrumb-item text-dark" href="/">Home</a>
                <span class="breadcrumb-item active">Contact</span>
            </nav>
        </div>
    </div>
</div>
<!-- Breadcrumb End -->

<!-- Contact Start -->

<div class="container-fluid">

```
<h2 class="section-title position-relative text-uppercase text-center mx-xl-5 mb-4">
    <span class="bg-secondary pr-3">Contact Us</span>
</h2>

<div class="px-xl-5">
    <div class="mb-5 contact-us">

        <div class="contact-form bg-light p-30">

            <div id="success"></div>

            <form method="POST" id="contactForm">

                {% csrf_token %}

                <div class="control-group">
                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        name="name"
                        placeholder="Your Name"
                        required="required"
                    />
                    <p class="help-block text-danger"></p>
                </div>

                <div class="control-group">
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Your Email"
                        required="required"
                    />
                    <p class="help-block text-danger"></p>
                </div>

                <div class="control-group">
                    <input
                        type="text"
                        class="form-control"
                        id="subject"
                        name="subject"
                        placeholder="Subject"
                        required="required"
                    />
                    <p class="help-block text-danger"></p>
                </div>

                <div class="control-group">
                    <textarea
                        class="form-control"
                        rows="8"
                        id="message"
                        name="message"
                        placeholder="Message"
                        required="required"
                    ></textarea>
                    <p class="help-block text-danger"></p>
                </div>

                <div>
                    <button
                        class="btn btn-primary py-2 px-4"
                        type="submit"
                        id="sendMessageButton">
                        Send Message
                    </button>
                </div>

            </form>

        </div>

    </div>
</div>
```

</div>
<!-- Contact End -->

{% endblock %}
